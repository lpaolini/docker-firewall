# dfw rules. See /usr/share/doc/dfw/README.md.
#
# dfw filters the containers on the Docker networks named here. Containers on
# them can't reach anything, and nothing can reach them, unless a rule below
# allows it. Other networks are left alone.
#
#   network NAME                  (one line per filtered network)
#   allow SOURCE -> DESTINATION[:PORT[/tcp|/udp] | :icmp]
#
# SOURCE and DESTINATION are containers in brackets ([name]: a container or
# compose service name), addresses, subnets, or internet, rfc1918, lan, host,
# any (every address) and dns (destination only). One side must be a
# container. Either side can be a comma-separated list.
#
# A rule opens connections in one direction; their replies are allowed. With
# a port and no protocol, TCP and UDP both apply; with no port, everything
# does, ICMP included. :icmp allows ICMP alone (ICMPv6 for IPv6).
#
# Saving this file changes nothing on a running system: run "dfw apply",
# which refuses rules with errors. When dfw starts (at boot, for example), it
# applies these rules if they are valid, else it keeps the rules last
# applied. More rules can go in /etc/dfw/rules.d/*.rules. Check a draft with:
# dfw check FILE
#
# Examples (remove the "# " to use one):
#
# -- Networks to filter. Every container on them is cut off until a rule
# -- names it.
# network fw
# network backend
#
# -- A web app: the proxy takes HTTPS from anywhere and talks to the app,
# -- the app talks to its database and cache.
# allow internet -> [proxy]:443/tcp, [proxy]:80/tcp
# allow [proxy] -> [app]:8080/tcp
# allow [app] -> [db]:5432/tcp, [cache]:6379/tcp
#
# -- Outbound: the app may call one API on HTTPS and look up names.
# allow [app] -> 203.0.113.10:443/tcp
# allow [app] -> dns
#
# -- A worker with full internet access, but not the LAN or the host.
# allow [worker] -> internet
#
# -- Private networks: an office subnet over SSH, any private IPv4 address,
# -- or the whole LAN (IPv4 and IPv6 private ranges).
# allow 10.10.30.0/24 -> [bastion]:22/tcp
# allow [backup] -> rfc1918
# allow [scanner] -> lan
#
# -- Single hosts, IPv4 and IPv6 (IPv6 in brackets when a port follows).
# allow [app] -> 10.10.20.20
# allow [app] -> [2001:db8::25]:587/tcp
#
# -- UDP only: a metrics agent sending to a collector.
# allow [agent] -> 10.10.40.5:8125/udp

# -- TCP and UDP: a port with no protocol allows both, here a DNS server on
# -- the LAN (DNS uses UDP, and TCP for large answers).
# allow [app] -> 10.10.20.53:53

# -- RTSP (TCP and UDP): a video recorder pulling streams from cameras on
# -- the LAN.
# allow [nvr] -> 10.10.50.0/24:554

# -- NTP: let a container set its clock from time servers on the internet.
# allow [chrony] -> internet:123/udp
#
# -- ICMP: let the app ping the internet and its database, and let anything
# -- on the LAN ping the proxy. Only ICMP is allowed by these.
# allow [app] -> internet:icmp, [db]:icmp
# allow lan -> [proxy]:icmp
#
# -- The host: health checks from the host, and a container that uses a
# -- service on the host (host means the host's addresses and the gateways).
# allow host -> [app]:8080/tcp
# allow [app] -> host:9100/tcp
#
# -- Several sources and destinations at once.
# allow [web1], [web2] -> [db]:5432/tcp, [cache]:6379/tcp
#
# -- The EC2 instance metadata service (link-local, so never in internet).
# allow [app] -> 169.254.169.254:80/tcp
