name: build

# Builds the dfw Debian packages for amd64 and arm64 and runs the unit, gate
# and acceptance tests on every push and pull request.
#   push to dev       -> rolling "dev" pre-release -> APT suite "dev"
#   tag vX.Y.Z (main) -> GitHub release vX.Y.Z    -> APT suite "stable"
# of the shared APT repository https://lpaolini.github.io/apt (lpaolini/apt).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:trixie
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper \
            golang-go lintian binutils-aarch64-linux-gnu dpkg-dev git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # version.sh needs the tags and history
      - name: Resolve version and channel
        id: version
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(packaging/version.sh)"
          channel=none
          if [[ "$GITHUB_EVENT_NAME" = push && "$GITHUB_REF_TYPE" = tag ]]; then
            if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
              echo "Tag $GITHUB_REF_NAME does not resolve to a release version (got $version)" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tags must point to a commit on main" >&2
              exit 1
            fi
            if [[ "$(dpkg-parsechangelog -S Version)" != "$version" ]]; then
              echo "debian/changelog has no entry for $version" >&2
              exit 1
            fi
            channel=stable
          elif [[ "$GITHUB_EVENT_NAME" = push && "$GITHUB_REF" = refs/heads/dev ]]; then
            channel=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Building $version (channel: $channel)"
      - name: No third-party Go modules
        run: |
          if grep -q '^require' go.mod || [ -e go.sum ]; then
            echo "go.mod must have no require lines and there must be no go.sum"; exit 1
          fi
      - name: Unit tests
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/b && cp -r . /tmp/b/dfw && cd /tmp/b/dfw
          sed -i "1s/^dfw ([^)]*)/dfw ($VERSION)/" debian/changelog
          dpkg-buildpackage -us -uc
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -B -us -uc -a arm64 -d -Pcross,nocheck
          cd /tmp/b
          lintian --pedantic --fail-on error,warning dfw_*_amd64.changes dfw_*_arm64.changes
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp *.deb "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  # Needs root and a real kernel with nf_conntrack_bridge. GitHub has no
  # Debian runners; Ubuntu's kernel and Docker stand in. The gate test proper
  # is run by hand on Debian 13 (docs/design.md, section 8).
  integration:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y nftables conntrack tcpdump jq socat
      # GitHub's runners drop outbound ICMP, and the tests ping 1.1.1.1 and
      # 1.0.0.1. Route both to a namespace that answers ping and HTTP, so the
      # containers reach them through Docker's NAT like real internet hosts.
      - name: Stand in for the internet test hosts
        run: |
          sudo ip netns add ext
          sudo ip link add ext0 type veth peer name ext1 netns ext
          sudo ip addr add 192.0.2.1/30 dev ext0
          sudo ip link set ext0 up
          sudo ip -n ext addr add 192.0.2.2/30 dev ext1
          sudo ip -n ext addr add 1.1.1.1/32 dev lo
          sudo ip -n ext addr add 1.0.0.1/32 dev lo
          sudo ip -n ext link set lo up
          sudo ip -n ext link set ext1 up
          sudo ip -n ext route add default via 192.0.2.1
          sudo ip route add 1.1.1.1/32 via 192.0.2.2
          sudo ip route add 1.0.0.1/32 via 192.0.2.2
          mkdir -p "$RUNNER_TEMP/www"
          sudo setsid nohup ip netns exec ext python3 -m http.server 80 \
            --directory "$RUNNER_TEMP/www" >"$RUNNER_TEMP/http.log" 2>&1 < /dev/null &
          sleep 1
          ping -c1 -W3 1.1.1.1 && curl -sf -m5 -o /dev/null http://1.0.0.1/
      - name: Build the test image
        run: printf 'FROM alpine:3.22\nRUN apk add --no-cache socat curl bind-tools tcpdump iproute2\n' | docker build -q -t dfw-tools -
      - name: Gate test
        run: |
          sudo PRIO=-150 test/gate.sh q1
          sudo PRIO=-150 N=200 test/gate.sh first
      - name: Acceptance tests
        run: sudo test/integration.sh dist/dfw_*_amd64.deb
      - name: Unit tests as root, against the real nft
        run: |
          sudo DFW_TEST_APPLY=1 "$(command -v go)" test ./internal/nft/

  # Serialized, so a newer dev push can never replace the dev release while
  # an older run is still creating it. The APT repository (lpaolini/apt) is
  # rebuilt from the releases of all its projects.
  release:
    needs: [package, integration]
    if: needs.package.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.package.outputs.channel }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish rolling dev pre-release
        if: env.CHANNEL == 'dev'
        run: |
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev dist/* --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Development build $VERSION" \
            --notes "Automatic build of $GITHUB_SHA from the dev branch. Not for production use."
      - name: Rebuild the APT repository
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run publish.yaml -R lpaolini/apt
